name: Security Scan

on:
  push:
    branches: ["main", "production"]
  pull_request:
    branches: ["main", "production"]
  schedule:
    - cron: '0 6 * * 1'  # Weekly — Monday 6 AM UTC

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry and Plugins
        run: pip install poetry poetry-plugin-export

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          cd backend
          poetry export -f requirements.txt --output requirements.txt --without-hashes
          pip-audit -r requirements.txt --strict --desc

      - name: Run Safety Scan
        run: |
          pip install safety
          cd backend
          # Run safety check on dependencies
          safety check -r requirements.txt || echo "Safety detected vulnerabilities"

  trivy-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  sast:
    name: Static Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install "bandit[toml]"

      - name: Run Bandit
        run: bandit -r backend/app/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  secret-detection:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.2"
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --verbose --redact