replicaCount: 1

image:
  repository: envforage-backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  host: envforage.local
  tls: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

env:
  DATABASE_URL: "postgresql+asyncpg://envforage:changeme@envforage-postgres:5432/envforage"
  REDIS_URL: "redis://envforage-redis:6379/0"

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  # StatefulSet is an alternative to the default Redis Deployment
  # (templates/redis.yaml) for production-grade deployments needing a
  # stable network identity and persistent, per-pod storage. Disabled
  # by default to avoid double-provisioning; enable one or the other.
  statefulset:
    enabled: false
    replicas: 1
    storage: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

postgres:
  image: postgres:16-alpine
  user: envforage
  password: changeme
  db: envforage
  storage: 5Gi
  # StatefulSet is an alternative to the default Postgres Deployment
  # (templates/postgres.yaml) for production-grade deployments needing
  # a stable network identity and per-pod persistent storage. Disabled
  # by default to avoid double-provisioning; enable one or the other.
  statefulset:
    enabled: false
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

ollama:
  image: ollama/ollama:latest

frontend:
  repository: envforage-frontend
  tag: latest
  pullPolicy: IfNotPresent
  apiUrl: "/api/v1"

networkPolicy:
  enabled: true
  dnsNamespace: kube-system
