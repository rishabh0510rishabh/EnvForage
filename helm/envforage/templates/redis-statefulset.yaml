{{- if .Values.redis.statefulset.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "envforage.fullname" . }}-redis-headless
  labels:
    app: {{ include "envforage.fullname" . }}-redis
spec:
  clusterIP: None
  selector:
    app: {{ include "envforage.fullname" . }}-redis
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
      name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "envforage.fullname" . }}-redis
  labels:
    app: {{ include "envforage.fullname" . }}-redis
spec:
  serviceName: {{ include "envforage.fullname" . }}-redis-headless
  replicas: {{ .Values.redis.statefulset.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ include "envforage.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "envforage.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: {{ .Values.redis.port }}
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.redis.statefulset.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.redis.statefulset.resources.requests.memory | default "128Mi" }}
            limits:
              cpu: {{ .Values.redis.statefulset.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.redis.statefulset.resources.limits.memory | default "512Mi" }}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.redis.statefulset.storage | default "1Gi" }}
{{- end }}
