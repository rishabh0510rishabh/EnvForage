{{- if .Values.postgres.statefulset.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "envforage.fullname" . }}-postgres-headless
  labels:
    app: {{ include "envforage.fullname" . }}-postgres
spec:
  clusterIP: None
  selector:
    app: {{ include "envforage.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "envforage.fullname" . }}-postgres
  labels:
    app: {{ include "envforage.fullname" . }}-postgres
spec:
  serviceName: {{ include "envforage.fullname" . }}-postgres-headless
  replicas: {{ .Values.postgres.statefulset.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ include "envforage.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "envforage.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.postgres.statefulset.resources.requests.cpu | default "250m" }}
              memory: {{ .Values.postgres.statefulset.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.postgres.statefulset.resources.limits.cpu | default "1" }}
              memory: {{ .Values.postgres.statefulset.resources.limits.memory | default "1Gi" }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
